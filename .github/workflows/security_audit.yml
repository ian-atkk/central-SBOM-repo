name: Scan project SBOMs for vulnerabilities

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout central SBOM repo
        uses: actions/checkout@v4

      - name: Install mise and project tools
        uses: jdx/mise-action@v5

      - name: Scan all release SBOMs
        run: |
          find . -path "*/sboms/*.cdx.json" -print0 |
          while IFS= read -r -d '' sbom; do
            project=$(echo "$sbom" | cut -d/ -f2)
            version=$(basename "$sbom" .cdx.json)

            mkdir -p "$project/vulnerability_reports/releases"

            echo "Scanning $project $version"

            mise exec -- grype "sbom:$sbom" \
              -o json > "$project/vulnerability_reports/releases/$version.json"
          done

      - name: Commit and push vulnerability reports for SBOMS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*/vulnerability_reports/releases/*.json'

          if git diff --cached --quiet; then
            echo "No vulnerability report changes for SBOMs"
            exit 0
          fi

          git commit -m "Update vulnerability reports for SBOMs"
          git push